<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tuần 7: Responsive layout</title>
<style>:root{color-scheme:light dark;font:16px/1.5 system-ui}body{max-width:42rem;margin:auto;padding:2rem}.card{border:1px solid;padding:1rem;border-radius:.75rem}button:focus-visible{outline:3px solid #f59e0b}</style></head>
<body><main><h1>Responsive layout</h1><section class="card" aria-labelledby="lab-title"><h2 id="lab-title">Mẫu kiểm thử HCI</h2><p id="status" aria-live="polite">Chưa thực hiện.</p><button id="action" type="button">Thực hiện tác vụ</button></section></main>
<script>"use strict";document.querySelector("#action").addEventListener("click",()=>{document.querySelector("#status").textContent="Đã hoàn thành; hãy đo thời gian và lỗi của người dùng.";});</script></body></html>
