---
layout: default
---
<link rel="stylesheet" href="{{ site.baseurl }}/assets/style.css">
<script defer src="{{ site.baseurl }}/assets/app.js"></script>

<header class="site-header compact">
  <a class="brand" href="{{ site.baseurl }}/">AERO<span>ACADEMY</span></a>
  <a class="header-link" href="{{ site.baseurl }}/">← Tất cả khóa học</a>
</header>

<main class="course-shell">
  <header class="course-hero">
    <p class="eyebrow">{{ page.course_group }}</p>
    <h1>{{ page.title }}</h1>
    <div class="course-meta"><span>{{ page.weeks }}</span><span>Học theo tiến độ cá nhân</span><span>Miễn phí</span></div>
    <a class="primary-button" href="#lessons">Xem lộ trình học ↓</a>
  </header>
  <div id="lessons">{{ content }}</div>
</main>

<footer class="site-footer"><a class="brand" href="{{ site.baseurl }}/">AERO<span>ACADEMY</span></a><p>Học từ nền tảng. Làm ra sản phẩm.</p></footer>
