# _config.yml — Fullstack4kid Academy GitHub Pages (Jekyll)
title: "Fullstack4kid Academy"
tagline: "Kho giáo trình công nghệ 10-20 tuần · 6 nhóm ngành"
description: >-
  Hệ thống khóa học lập trình, cybersecurity, AI/Data, hạ tầng mạng, đồ họa và
  phần cứng. Mỗi khóa có giáo trình (INDEX), lịch tuần, bài giảng, code và đồ án.
author: Fullstack4kid
lang: "vi"

# GitHub Pages build từ thư mục ./site; baseurl theo tên repo hiện tại.
# Khi tạo repo user-site (aero-fullstack4kid.github.io), đặt baseurl: ""
baseurl: "/Aero-Fullstack4kid"

# Repo gốc (dùng để tạo link mở INDEX.md qua giao diện web GitHub)
github_repo: "https://github.com/aerovfx/Aero-Fullstack4kid"
github_branch: "main"

theme: minima

# Trang `<slug>.md` → `/courses/<slug>/` (không cần đuôi .html trên link)
permalink: pretty

# Không build các thư mục lớn bên ngoài ./site
exclude:
  - "*.md.tmp"
  - "vendor/bundle"
  - "node_modules"
  - "*.pdf"
  - "*.ppt*"
  - "*.mp4"

plugins:
  - jekyll-feed

defaults:
  - scope:
      path: "courses"
    values:
      layout: "course"
  - scope:
      path: "pages"
    values:
      layout: "default"